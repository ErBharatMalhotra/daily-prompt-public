name: Weekly Evolution

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 08:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone private core
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          rm -rf core
          TOKEN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \\"')"
          git clone --depth 1 "https://${TOKEN}@github.com/ErBharatMalhotra/AI-Newsroom.git" core

      - name: Run evolution (weakest journalist inherits winner habits)
        working-directory: core
        env:
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: node engine/evolve.js

      - name: Rebuild site (leaderboard reflects new genome versions)
        working-directory: core
        run: node site/build.js

      - name: Commit evolution report + genomes to core
        if: success()
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          cd core
          TOKEN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \\"')"
          git config user.name "newsroom-bot"
          git config user.email "noreply@github.com"
          git add -f data/ site/dist/
          git diff --cached --quiet || git commit -m "evolve: weekly mutation $(date -u +%F) [skip ci]"
          git push "https://${TOKEN}@github.com/ErBharatMalhotra/AI-Newsroom.git" HEAD:main

      - name: Push rebuilt site to public repo
        if: success()
        run: |
          git config user.name "newsroom-bot"
          git config user.email "noreply@github.com"
          git pull --rebase origin main || true
          rm -rf site/dist
          mkdir -p site/dist
          cp -r "$GITHUB_WORKSPACE/core/site/dist/." site/dist/
          git add site/dist
          git diff --cached --quiet || git commit -m "site: leaderboard update $(date -u +%F)"
          git push origin main

      # Cloudflare Pages is git-connected to this repo: the site push above auto-deploys.

      # Dead-man switch: must stay the LAST step so `if: failure()` sees any
      # earlier step's failure and tells the owner on Telegram.
      - name: Failure alert (Telegram)
        if: failure()
        working-directory: core
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node engine/alert.js fail "Weekly evolution workflow failed at $(date -u +%F\ %H:%M\ UTC) — check the Actions log for the failing step."
