name: Weekly Evolution

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 08:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (OG card generator)
        run: pip install --quiet pillow

      # Header auth, not https://<token>@github.com/... — see checkout-core.
      - name: Checkout private core
        uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.CORE_TOKEN }}

      - name: Run evolution (weakest journalist inherits winner habits)
        working-directory: core
        env:
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: node engine/evolve.js

      - name: Rebuild site (leaderboard reflects new genome versions)
        working-directory: core
        env:
          BUNDLES_KEEP_FILES: "0"   # Phase 2: packed days drop their originals
        run: node site/build.js

      - name: Commit evolution report + genomes to core
        if: success()
        run: |
          cd core
          git config user.name "newsroom-bot"
          git config user.email "noreply@github.com"
          git add -f data/ site/dist/
          git diff --cached --quiet || git commit -m "evolve: weekly mutation $(date -u +%F) [skip ci]"
          bash "$GITHUB_WORKSPACE/.github/scripts/push-retry.sh" main

      - name: Push rebuilt site to public repo
        if: success()
        run: |
          git config user.name "newsroom-bot"
          git config user.email "noreply@github.com"
          test -n "$(ls -A "$GITHUB_WORKSPACE/core/site/dist")" || { echo "::error::core/site/dist is empty — refusing to publish"; exit 1; }
          rm -rf site/dist
          mkdir -p site/dist
          cp -r "$GITHUB_WORKSPACE/core/site/dist/." site/dist/
          git add -A -- site/dist
          git diff --cached --quiet || git commit -m "site: leaderboard update $(date -u +%F)"
          bash .github/scripts/push-retry.sh main

      # Cloudflare Pages is git-connected to this repo: the site push above auto-deploys.

      # Dead-man switch: must stay the LAST step so `if: failure()` sees any
      # earlier step's failure and tells the owner on Telegram. It must never fail
      # on its own — a missing clone used to abort it with "working directory does
      # not exist", so the alert never went out.
      - name: Failure alert (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -d core ] && [ -f core/engine/alert.js ]; then
            cd core
            node engine/alert.js fail "Weekly evolution workflow failed at $(date -u +%F\ %H:%M\ UTC) — check the Actions log for the failing step."
          else
            echo "::warning::core clone missing — cannot send the Telegram failure alert from the pipeline; the red run is the signal"
          fi
