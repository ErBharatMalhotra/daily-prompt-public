name: Daily Edition

on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 IST — main edition (14 full articles)
    - cron: "30 6 * * *"    # 12:00 IST — briefs + wire refresh
    - cron: "30 10 * * *"   # 16:00 IST — evening editions
    - cron: "0 14 * * *"    # 19:30 IST — night edition
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (OG card generator)
        run: pip install --quiet pillow

      # Header auth, not https://<token>@github.com/... — git drops the URL
      # credential on GitHub's 301 redirect and the clone died with
      # "fatal: could not read Username" (2026-10-19..22: three editions lost
      # before any work started). The header also authenticates every push this
      # job makes back to the core.
      - name: Checkout private core
        uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.CORE_TOKEN }}

      - name: Run tests (sanity gate)
        working-directory: core
        run: node tests/sanity.test.js

      # Dead-man switch preflight: warns + Telegram-alerts when the last
      # successful edition is stale (quota dead, feeds down, etc).
      - name: Staleness guard (dead-man switch)
        working-directory: core
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node engine/alert.js guard

      - name: Run pipeline (scrape -> select -> write -> edit -> gate)
        working-directory: core
        env:
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Quality-first knobs: the site is also a monetisation platform, so
          # every published page must clear the editor floor. Fewer, denser,
          # better-scored stories beat volume — exhausted free-tier quotas are
          # acceptable, weak pages are not. (Throughput knobs kept for rollback.)
          LLM_MAX_CALLS: "400"        # budget headroom stays high on purpose
          DAILY_ARTICLES: "10"        # fewer picks, deeper attention per story
          BRIEFS_PER_RUN: "8"         # short rewrites (thin summaries filtered in-run)
          MIN_EDITOR_SCORE: "6"       # publish floor: below = held back, not shown
          LLM_DELAY_MS: "1500"        # pacing between calls
          RETRY_429_MS: "12000"       # wait on 429 instead of failing over
          LLM_SLOTS: ${{ secrets.LLM_SLOTS || '' }}  # empty = default rotation (highest-quota first)
          LLM_COOLDOWN_MS: "60000"
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN || '' }}
          PUSH_ADMIN_KEY: ${{ secrets.PUSH_ADMIN_KEY }}
          BUNDLES_KEEP_FILES: "0"   # Phase 2: packed days drop their originals
        run: |
          node engine/scrape.js
          node engine/run.js
          node site/build.js
          node engine/digest.js
          # Retirement gate: a retired article must not be built, listed in a sitemap/feed/search-index,
          # or linked from any page. Runs after build so the failure blocks the push/deploy steps below.
          # Hard blocker, no presence check: the gate landed on core main 2026-10-06 and is proven live
          # in the real pipeline. If the file ever disappears from the core clone this step fails loudly
          # instead of silently skipping the only check that proves a retirement actually took effect.
          node scripts/retirement-gate.mjs --expect-manifest

      - name: Keepalive commit to core (editions + genomes + quarantine)
        if: success()
        run: |
          cd core
          git config user.name "newsroom-bot"
          git config user.email "noreply@github.com"
          git add -f data/ site/dist/
          git diff --cached --quiet || git commit -m "edition: $(date -u +%F-%H%M)"
          # HEAD:main through origin — the checkout action's header still carries
          # the PAT, so no token appears in a URL. push-retry.sh retries GitHub's
          # transient 5xx ("remote rejected ... Internal Server Error") and rebases
          # if another edition slipped in first.
          bash "$GITHUB_WORKSPACE/.github/scripts/push-retry.sh" main

      - name: Push built site to public repo
        if: success()
        run: |
          git config user.name "newsroom-bot"
          git config user.email "noreply@github.com"
          test -n "$(ls -A "$GITHUB_WORKSPACE/core/site/dist")" || { echo "::error::core/site/dist is empty — refusing to publish"; exit 1; }
          rm -rf site/dist
          mkdir -p site/dist
          cp -r "$GITHUB_WORKSPACE/core/site/dist/." site/dist/
          git add -A -- site/dist
          git diff --cached --quiet || git commit -m "site: $(date -u +%F-%H%M)"
          bash .github/scripts/push-retry.sh main

      # Web push: alert PWA subscribers about the new edition (free, no FCM
      # project needed — standard VAPID web push). Non-fatal by design.
      - name: Web push (new edition alert)
        if: success()
        working-directory: core
        env:
          SITE_BASE: ${{ secrets.SITE_BASE || 'https://news.bharatdn.com' }}
          PUSH_ADMIN_KEY: ${{ secrets.PUSH_ADMIN_KEY }}
          VAPID_PUBLIC_B64URL: ${{ secrets.VAPID_PUBLIC_B64URL }}
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
        run: |
          npm install --no-save web-push >/dev/null 2>&1
          HEADLINE=$(node -e "const t=require('./data/today.json');const a=(t.articles||[]).find(x=>x.published);if(a)console.log(a.headline.replace(/\\n/g,' '))")
          COUNT=$(node -e "const t=require('./data/today.json');console.log((t.articles||[]).filter(x=>x.published).length)")
          node scripts/push-notify.mjs send "{\"headline\":\"$HEADLINE\",\"body\":\"Today's edition: $COUNT stories — written, edited and fact-gated by the AI newsroom.\",\"url\":\"/?source=push\"}" || echo "[push] non-fatal"
        continue-on-error: true

      # Cloudflare Pages is git-connected to this repo (Settings -> Build -> Git
      # repository in the dashboard): pushing site/dist above auto-deploys the site.

      # Dead-man switch: must stay the LAST step so `if: failure()` sees any
      # earlier step's failure and tells the owner on Telegram.
      #
      # It must never be the thing that fails: with `working-directory: core` a
      # failed clone made this step abort with "working directory does not exist"
      # and the alert never went out. Now it runs from the workspace and only
      # changes directory if the clone actually landed.
      - name: Failure alert (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -d core ] && [ -f core/engine/alert.js ]; then
            cd core
            node engine/alert.js fail "Daily edition workflow failed at $(date -u +%F\ %H:%M\ UTC) — check the Actions log for the failing step."
          else
            echo "::warning::core clone missing — cannot send the Telegram failure alert from the pipeline; the red run is the signal"
          fi

      - name: Trigger Cloudflare Pages deploy (deploy hook)
        if: success()
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -n "$CF_DEPLOY_HOOK" ]; then
            curl -s -X POST "$CF_DEPLOY_HOOK" && echo "[deploy] cloudflare hook triggered"
          else
            echo "[deploy] CF_DEPLOY_HOOK not set - skipping"
          fi
