name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # site/dist is deliberately NOT ignored. Every push this repo receives is
      # site/dist from an edition, and skipping that meant CI quietly stopped
      # (last real run 6 October) while the private core's own workflow carried
      # the sanity gate and kept a workflow running in a private repo. That one
      # is gone now; each site push tests the freshly cloned core instead.
      - "**.md"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Header auth, not a token in the URL: git drops the URL credential on
      # GitHub's 301 redirect and this job then failed before running a test.
      - name: Checkout private core
        uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.CORE_TOKEN }}

      - name: Sanity suite
        working-directory: core
        run: node tests/sanity.test.js

      - name: Privacy gate (core must not leak into public repo)
        run: node scripts/privacy-gate.mjs
